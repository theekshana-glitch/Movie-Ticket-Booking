<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login - Movie Booking</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <h2>🎬 Admin Login</h2>
      <form id="loginForm">
        <input type="text" id="username" placeholder="Username" value="admin" required>
        <input type="password" id="password" placeholder="Password" value="admin123" required>
        <button type="submit">Login</button>
        <div id="msg" class="message"></div>
        <p style="margin-top:14px; font-size:0.85rem; color:#666; text-align:center;">
          Default: <strong>admin / admin123</strong>
        </p>
      </form>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

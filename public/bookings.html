<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"><title>Bookings</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div id="app-header"></div>
  <div class="container">
    <h2>Manage Bookings</h2>
    <div class="card">
      <h3>New Booking</h3>
      <form id="bookingForm" class="form-grid">
        <input id="guest_name" placeholder="Guest Name" required>
        <input id="guest_email" type="email" placeholder="Email" required>
        <input id="guest_phone" placeholder="Phone">
        <select id="show_id" required><option value="">Select Show</option></select>
        <input id="seats_booked" type="number" min="1" value="1" placeholder="Seats" required>
        <button class="btn" type="submit">Book Ticket</button>
      </form>
      <div id="msg"></div>
    </div>
    <div class="card">
      <h3>Bookings List</h3>
      <label>Filter by Date: <input type="date" id="filterDate"></label>
      <table id="bookingsTable" style="margin-top:12px;">
        <thead><tr>
          <th>ID</th><th>Guest</th><th>Email</th>
          <th>Movie</th><th>Screen</th><th>Date/Time</th>
          <th>Seats</th><th>Amount</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/bookings.js"></script>
</body>
</html>

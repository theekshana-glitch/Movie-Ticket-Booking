<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"><title>Shows</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div id="app-header"></div>
  <div class="container">
    <h2>Manage Shows</h2>
    <div class="card">
      <h3>Add / Edit Show</h3>
      <form id="showForm" class="form-grid">
        <select id="movie_id" required><option value="">Select Movie</option></select>
        <input id="screen_name" placeholder="Screen Name" required>
        <input id="show_date" type="date" required>
        <input id="show_time" type="time" required>
        <input id="ticket_price" type="number" step="0.01" placeholder="Ticket Price" required>
        <input id="total_seats" type="number" placeholder="Total Seats" value="100" required>
        <button class="btn" type="submit">Save Show</button>
      </form>
      <div id="msg"></div>
    </div>
    <div class="card">
      <h3>Show List</h3>
      <table id="showsTable">
        <thead><tr><th>ID</th><th>Movie</th><th>Screen</th><th>Date</th><th>Time</th><th>Price</th><th>Seats</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/shows.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"><title>Movies</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div id="app-header"></div>
  <div class="container">
    <h2>Manage Movies</h2>
    <div class="card">
      <h3>Add / Edit Movie</h3>
      <form id="movieForm" class="form-grid">
        <input id="title" placeholder="Title" required>
        <input id="genre" placeholder="Genre" required>
        <input id="language" placeholder="Language" required>
        <input id="duration" type="number" placeholder="Duration (min)" required>
        <input id="rating" placeholder="Rating e.g. PG-13">
        <input id="release_date" type="date">
        <textarea id="description" placeholder="Description" rows="2"></textarea>
        <button class="btn" type="submit">Save Movie</button>
      </form>
      <div id="msg"></div>
    </div>
    <div class="card">
      <h3>Movie List</h3>
      <table id="moviesTable">
        <thead><tr><th>ID</th><th>Title</th><th>Genre</th><th>Lang</th><th>Dur</th><th>Rating</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/movies.js"></script>
</body>
</html>

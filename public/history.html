<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"><title>Watch History</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div id="app-header"></div>
  <div class="container">
    <h2>Watch History</h2>
    <div class="card">
      <h3>Add Entry</h3>
      <form id="historyForm" class="form-grid">
        <input id="guest_email" type="email" placeholder="Guest Email" required>
        <select id="movie_id" required><option value="">Select Movie</option></select>
        <input id="watched_on" type="date" required>
        <input id="rating" type="number" min="0" max="5" placeholder="Rating (0-5)">
        <textarea id="review" placeholder="Review" rows="2"></textarea>
        <button class="btn" type="submit">Add</button>
      </form>
      <div id="msg"></div>
    </div>
    <div class="card">
      <table id="historyTable">
        <thead><tr>
          <th>ID</th><th>Email</th><th>Movie</th>
          <th>Watched On</th><th>Rating</th><th>Review</th><th>Actions</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
